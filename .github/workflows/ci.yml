name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Unit, int (~6 min) and e2e (~8 min) against the Frankfurt test branch ran past 15 min on 4 Nov 2026
    # (run 41754981195: every suite passed, cancelled 4 s into openapi:check).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      # Integration and e2e run in a per-run schema on the Neon `test` branch (PRD-API §12).
      - run: pnpm test:int
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      - run: pnpm test:e2e
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      - run: pnpm build
      # Full diff against the vendored contract (docs/contract/openapi.v0.yaml).
      - run: pnpm openapi:check
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Audit all dependencies (report only; dev tooling has unpatched DoS advisories)
        run: pnpm audit || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: eduujoy-api:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /health in the built image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e APP_ORIGIN=https://eduujoy.aindrajaya.my.id \
            -e API_PUBLIC_URL=https://api.eduujoy.aindrajaya.my.id \
            -e DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:5432/smoke \
            eduujoy-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
