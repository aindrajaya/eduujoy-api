name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Unit, int (~6 min) and e2e (~8 min) against the Frankfurt test branch ran past 15 min on 4 Nov 2026
    # (run 41754981195: every suite passed, cancelled 4 s into openapi:check).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      # Integration and e2e run in a per-run schema on the Neon `test` branch (PRD-API §12).
      - run: pnpm test:int
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      - run: pnpm test:e2e
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      - run: pnpm build
      # Full diff against the vendored contract (docs/contract/openapi.v0.yaml).
      - run: pnpm openapi:check
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Audit all dependencies (report only; dev tooling has unpatched DoS advisories)
        run: pnpm audit || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    # The built image boots as in production (NODE_ENV=production) against a throwaway Postgres with the
    # schema migrated: boot enqueues the liveness and refund sweeps, so it needs the jobs table (lead
    # gate, 7 Nov 2026). Every env value is a ci-dummy placeholder (.github/ci/smoke-env.list); no secret.
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate the smoke database
        run: pnpm db:migrate
        env:
          DATABASE_URL_DIRECT: postgresql://smoke:smoke@127.0.0.1:5432/smoke
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: eduujoy-api:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Expected: one outbound 401 warning from the billing key-mode check. Boot runs it in the background
      # (an A12 safety check that catches a test key in live mode); with the ci-dummy key it only logs.
      - name: Smoke test /health and /ready in the built image
        run: |
          docker run -d --name api --network host --env-file .github/ci/smoke-env.list eduujoy-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              curl -fsS http://localhost:8000/ready && exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1
